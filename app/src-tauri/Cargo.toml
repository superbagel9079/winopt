[package]
name = "winopt"
version = "0.1.0"
description = "Windows tuning that starts from the machine it runs on"
license = "MIT"
edition = "2021"
rust-version = "1.89"

[lib]
name = "winopt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wmi = "0.18.4"
winreg = "0.56.0"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
